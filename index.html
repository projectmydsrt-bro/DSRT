<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSRT.js WaveGrid Background</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0b0f1a;
      color: #fff;
      font-family: sans-serif;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 0;
    }
    .hero {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin: 0;
      color: #00ffee;
    }
    p {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <canvas id="dsrt-canvas"></canvas>
  <div class="hero">
    <h1>DSRT.js</h1>
    <p>WaveGrid Background Demo</p>
  </div>

  <script>
    // ========== DSRT.js Mini (WaveGrid Background) ==========
    const canvas = document.getElementById("dsrt-canvas");
    const gl = canvas.getContext("webgl");
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    // Shader source
    const vertexShaderSrc = `
      attribute vec2 position;
      uniform float time;
      uniform vec2 resolution;
      varying float vHeight;
      void main() {
        float wave = sin(position.x*10.0 + time) * 0.05 +
                     cos(position.y*10.0 + time*0.7) * 0.05;
        vHeight = wave;
        gl_Position = vec4(position.x, position.y + wave, 0.0, 1.0);
      }
    `;
    const fragmentShaderSrc = `
      precision mediump float;
      varying float vHeight;
      void main() {
        vec3 color = mix(vec3(0.0,0.1,0.2), vec3(0.0,1.0,0.8), vHeight+0.5);
        gl_FragColor = vec4(color,1.0);
      }
    `;

    function createShader(type, src) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, src);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const vShader = createShader(gl.VERTEX_SHADER, vertexShaderSrc);
    const fShader = createShader(gl.FRAGMENT_SHADER, fragmentShaderSrc);

    const program = gl.createProgram();
    gl.attachShader(program, vShader);
    gl.attachShader(program, fShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    const posLoc = gl.getAttribLocation(program, "position");
    const timeLoc = gl.getUniformLocation(program, "time");
    const resLoc = gl.getUniformLocation(program, "resolution");

    // Buat grid points
    const gridSize = 200;
    let vertices = [];
    for (let x = -1; x <= 1; x += 2/gridSize) {
      for (let y = -1; y <= 1; y += 2/gridSize) {
        vertices.push(x, y);
      }
    }
    const vertexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    function render(time) {
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(timeLoc, time * 0.001);
      gl.uniform2f(resLoc, canvas.width, canvas.height);
      gl.drawArrays(gl.POINTS, 0, vertices.length/2);
      requestAnimationFrame(render);
    }
    render(0);
  </script>
</body>
</html>
